<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obitski</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #6f6b67;
      --paper: #f7f3ee;
      --glow: rgba(0, 0, 0, 0.08);
      --accent: #c7a46a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(1200px 600px at 50% 15%, #ffffff 0%, var(--paper) 60%, #efe9e1 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 0, 0, 0.03), transparent 35%),
        radial-gradient(circle at 80% 10%, rgba(0, 0, 0, 0.02), transparent 35%),
        radial-gradient(circle at 50% 80%, rgba(0, 0, 0, 0.03), transparent 40%);
      mix-blend-mode: multiply;
    }

    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 48px 20px 56px;
    }

    .card {
      width: min(820px, 92vw);
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(17, 17, 17, 0.08);
      box-shadow: 0 20px 60px var(--glow);
      border-radius: 26px;
      padding: 44px 36px 40px;
      backdrop-filter: blur(10px);
    }

    .logo {
      max-width: 420px;
      width: 78%;
      height: auto;
      margin-bottom: 26px;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.16));
    }

    .text {
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.65;
      max-width: 600px;
      min-height: 6.5em;
      margin: 0 auto 24px;
      letter-spacing: 0.01em;
    }

    .text.typing::after {
      content: "▍";
      display: inline-block;
      margin-left: 4px;
      color: var(--accent);
      animation: blink 1.1s step-end infinite;
      vertical-align: baseline;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .input-wrapper {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .input-wrapper.visible {
      opacity: 1;
      transform: translateY(0);
    }

    form {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    input {
      font-family: inherit;
      font-size: 1.05rem;
      padding: 12px 14px;
      width: min(360px, 86vw);
      border: 1px solid rgba(17, 17, 17, 0.2);
      border-radius: 12px;
      outline: none;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: rgba(17, 17, 17, 0.5);
      box-shadow: 0 0 0 3px rgba(199, 164, 106, 0.22);
    }

    input::placeholder {
      color: var(--muted);
    }

    button {
      font-family: inherit;
      font-size: 1.02rem;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(17, 17, 17, 0.2);
      background: #111;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.14);
      background: #1d1d1d;
    }

    .response {
      margin-top: 14px;
      font-size: 0.98rem;
      color: var(--muted);
      min-height: 1.3em;
    }

    @media (max-width: 520px) {
      .card {
        padding: 38px 22px 34px;
      }

      .logo {
        width: 86%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <img src="obitski-logo.png" alt="Obitski Logo" class="logo" />

      <div class="text typing" id="typewriter"></div>

      <div class="input-wrapper" id="inputWrapper">
        <form id="questionForm">
          <input
            type="text"
            name="question"
            placeholder="Ask about someone..."
            autocomplete="off"
            aria-label="Ask about someone"
          />
          <button type="submit">Ask</button>
        </form>
        <div class="response" id="response"></div>
      </div>
    </div>
  </div>

  <script>
    const lines = [
      "I read Obituaries.",
      "Everyday.",
      "Thousands of them.",
      "How can I help you?"
    ];

    const typingSpeed = 60;
    const linePause = 700;

    const container = document.getElementById("typewriter");
    const inputWrapper = document.getElementById("inputWrapper");
    const response = document.getElementById("response");
    const form = document.getElementById("questionForm");

    let lineIndex = 0;
    let charIndex = 0;

    function typeLine() {
      if (lineIndex >= lines.length) {
        container.classList.remove("typing");
        inputWrapper.classList.add("visible");
        return;
      }

      if (charIndex < lines[lineIndex].length) {
        container.innerHTML += lines[lineIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeLine, typingSpeed);
      } else {
        container.innerHTML += "<br>";
        charIndex = 0;
        lineIndex++;
        setTimeout(typeLine, linePause);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = form.question.value.trim();
      if (!value) {
        response.textContent = "Tell me a name or question to begin.";
        return;
      }
      response.textContent = "Thanks. Obitski is listening. We'll surface results soon.";
      form.question.value = "";
    });

    typeLine();
  </script>
</body>
</html>
