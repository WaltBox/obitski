<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obitski</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
      color: #000;
    }

    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .logo {
      max-width: 420px;
      width: 90%;
      height: auto;
      margin-bottom: 40px;
    }

    .text {
      font-size: 1.25rem;
      line-height: 1.6;
      max-width: 600px;
      min-height: 6em;
      margin-bottom: 30px;
    }

    .input-wrapper {
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .input-wrapper.visible {
      opacity: 1;
    }

    input {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      padding: 10px 14px;
      width: 320px;
      max-width: 90%;
      border: 1px solid #000;
      outline: none;
      background: #fff;
    }

    input::placeholder {
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="public/obitski-logo.png" alt="Obitski Logo" class="logo" />

    <div class="text" id="typewriter"></div>

    <div class="input-wrapper" id="inputWrapper">
      <input type="text" placeholder="Type your answer..." autofocus />
    </div>
  </div>

  <script>
    const lines = [
      "I read Obituaries.",
      "Everyday.",
      "Thousands of them.",
      "How can I help you?"
    ];

    const typingSpeed = 60;
    const linePause = 700;

    const container = document.getElementById("typewriter");
    const inputWrapper = document.getElementById("inputWrapper");

    let lineIndex = 0;
    let charIndex = 0;

    function typeLine() {
      if (lineIndex >= lines.length) {
        inputWrapper.classList.add("visible");
        return;
      }

      if (charIndex < lines[lineIndex].length) {
        container.innerHTML += lines[lineIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeLine, typingSpeed);
      } else {
        container.innerHTML += "<br>";
        charIndex = 0;
        lineIndex++;
        setTimeout(typeLine, linePause);
      }
    }

    typeLine();
  </script>
</body>
</html>
